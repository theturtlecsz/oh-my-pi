[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "omp-knowledge"
version = "0.1.0"
description = "Connected engineering knowledge service foundation powered by Cognee"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "omp-work",
    "cognee==1.5.4",
    "ladybug==0.19.0",
    "lancedb>=0.24.3,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "fastapi>=0.112,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.10.5,<3",
    "psycopg[binary]>=3.2.0,<4",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# External Cognee backends are opt-in. The embedded route (ladybug + lancedb)
# needs nothing beyond the main dependencies above; the pins below mirror the
# ``neo4j`` and ``postgres`` extras declared by the pinned cognee==1.5.4 exactly.
neo4j = [
    "neo4j>=5.28.0,<6",
]
postgres = [
    "asyncpg>=0.30.0,<1",
    "pgvector>=0.3.5,<0.4",
    "psycopg2>=2.9.10,<3",
]
external-backends = [
    "omp-knowledge[neo4j,postgres]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.21.2",
]

[project.scripts]
omp-knowledge = "omp_knowledge.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omp_knowledge = ["py.typed", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
tmp_path_retention_policy = "failed"
