[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "omp-work"
version = "0.1.0"
description = "Versioned Work Ledger domain contract"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.112,<1", "httpx>=0.27,<1", "pydantic>=2.12.5,<2.13", "psycopg[binary]>=3.3.4,<3.4", "uvicorn>=0.30,<1"]


[project.scripts]
omp-work = "omp_work.__main__:main"
[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omp_work = ["py.typed", "contracts/v1/*", "contracts/v1/decisions/*", "operations/sql/*.sql", "operations/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
