name: CI

on:
   schedule:
      - cron: "17 3 * * *"
   push:
      branches: [main]
      tags: ["v*"]
      paths:
         - "packages/**"
         - "python/**"
         - "infra/work-ledger/**"
         - "session-system/**"
         - "crates/**"
         - "scripts/**"
         - "bazel/**"
         - "MODULE.bazel"
         - "MODULE.bazel.lock"
         - "BUILD.bazel"
         - ".bazelrc"
         - ".bazelignore"
         - ".bazelversion"
         - "Cargo.toml"
         - "Cargo.lock"
         - "deny.toml"
         - "about.toml"
         - "LICENSE"
         - "THIRD-PARTY-NOTICES.txt"
         - "rust-toolchain.toml"
         - "rustfmt.toml"
         # A root dependency change (lockfile/catalog/patches) affects every
         # job; without these a lockfile-only push shipped untested — and a
         # release retagged onto such a commit never triggered its run.
         - "bun.lock"
         - "bunfig.toml"
         - "package.json"
         - "patches/**"
         # Doc-only pushes touching inventoried paths (e.g. docs/upstream-guardrail.md)
         # must still run the inventory check or their rows go stale, misattributing
         # the failure to the next PR (OMP-229).
         - "docs/**"
         - ".github/**"
         - ".github/workflows/**"
   pull_request:
      branches: [main, omp2]
      paths:
         - "packages/**"
         - "python/**"
         - "infra/work-ledger/**"
         - "session-system/**"
         - "crates/**"
         - "scripts/**"
         - "bazel/**"
         - "MODULE.bazel"
         - "MODULE.bazel.lock"
         - "BUILD.bazel"
         - ".bazelrc"
         - ".bazelignore"
         - ".bazelversion"
         - "Cargo.toml"
         - "Cargo.lock"
         - "deny.toml"
         - "about.toml"
         - "LICENSE"
         - "THIRD-PARTY-NOTICES.txt"
         - "rust-toolchain.toml"
         - "rustfmt.toml"
         - "bun.lock"
         - "bunfig.toml"
         - "package.json"
         - "patches/**"
         # Doc-only PRs touching inventoried paths (e.g. docs/upstream-guardrail.md)
         # must still run the inventory check or their rows go stale, misattributing
         # the failure to the next PR (OMP-229).
         - "docs/**"
         - ".github/**"
         - ".github/workflows/**"
   workflow_dispatch:
      inputs:
         release_tag:
            description: "Explicit release tag (e.g. v18.0.7) for manual release publish"
            type: string
            required: false
            default: ""
         skip_npm:
            description: "Skip npm publish"
            type: boolean
            default: false
# Release preparation reaches main through a PR; post-merge `release.ts publish`
# pushes the `v*` tag that starts publication. Keep the version-bump main run,
# tag-ref run, and manual dispatch in a per-sha group without cancellation so
# adjacent release events cannot cancel each other (#2564). Manual dispatch
# release metadata is resolved after checkout. Other events keep branch-wide
# cancellation for PR/main churn. Scheduled nightly runs use their own
# `nightly-<ref>` group so a main push cannot cancel a nightly (and vice versa).
concurrency:
   group: "${{ github.workflow }}-${{ github.event_name == 'schedule' && format('nightly-{0}', github.ref) || (startsWith(github.event.head_commit.message, 'chore: bump version to ') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && format('release-{0}', github.sha) || github.ref }}"
   cancel-in-progress: "${{ !(startsWith(github.event.head_commit.message, 'chore: bump version to ') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}"

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
   # native_addons builds the pair TS jobs need; native_addons_cross builds the
   # rest. Together they must equal //:natives-linux-all (checked in the cross
   # job), so a filegroup addition cannot silently skip both.
   NATIVES_X64_TARGETS: natives-linux-x64-baseline natives-linux-x64-modern
   NATIVES_CROSS_TARGETS: natives-linux-arm64 natives-linux-musl-arm64 natives-linux-musl-x64-baseline natives-win32-arm64 natives-win32-x64-baseline
   # Per-test wall-clock ceiling (seconds) for scripts/ci-test-ts.ts. omp-kata
   # runners with reclaim_guest_freed_memory (infra/tune-kata-runtime.sh) run
   # the SQLite/subprocess-heavy coding-agent suites 1.5-2x slower, which put
   # several cases (model-registry refresh, session fork, credential bridge)
   # over the 30 s default; 120 s still catches a real hang.
   OMP_TEST_TIMEOUT: "120"

permissions:
   contents: read

jobs:
   # After the release PR merges, `release.ts publish` pushes a `v*` tag at the
   # merged main commit. That tag-ref push starts the authoritative publish run.
   # `release_metadata` validates the tag and its reachability from origin/main,
   # then exposes its name and channel to downstream jobs. Main and PR runs are
   # non-release unless main HEAD is already tagged. A manual dispatch may name
   # a tag at the checked-out commit, run from a `v*` tag ref, or detect a tag at
   # main HEAD.
   release_metadata:
      name: Resolve release metadata
      # Hosted, not self-hosted: this ~20 s git-tag probe gates the whole release
      # chain, and queueing it behind the self-hosted rust runner adds dead minutes
      # to the darwin critical path.
      runs-on: ubuntu-22.04
      outputs:
         is-release: ${{ steps.detect.outputs.is-release }}
         release-tag: ${{ steps.detect.outputs.release-tag }}
         # Canary tags publish to npm's canary dist-tag (derived script-side), mark
         # the GitHub release prerelease, and skip the stable-only brew tap.
         channel: ${{ steps.detect.outputs.channel }}
      steps:
         # Main-branch runs and workflow_dispatch events fetch tags so
         # `git tag --points-at HEAD` can resolve the release tag. Tag-ref
         # dispatches use explicit tag refspecs where `--tags` conflicts,
         # so scope fetch-tags away from explicit tag refspecs.
         - uses: actions/checkout@v4
           with:
              fetch-tags: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')) }}
         - name: Detect release tag at HEAD
           id: detect
           shell: bash
           env:
              RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
              EVENT_NAME: ${{ github.event_name }}
              REF: ${{ github.ref }}
              REF_NAME: ${{ github.ref_name }}
           run: |
              is_release=false
              release_tag=""
              channel=stable
              tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-canary\.(0|[1-9][0-9]*))?$'
              if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$RELEASE_TAG_INPUT" ]; then
                candidate_tag="$RELEASE_TAG_INPUT"
                if [[ "$candidate_tag" =~ [$'\r\n'] ]] || ! [[ "$candidate_tag" =~ $tag_pattern ]]; then
                  echo "::error title=Release Refused::Invalid release tag format: $candidate_tag" >&2
                  exit 1
                fi
                if ! git fetch origin --tags --depth=100; then
                  echo "::error title=Release Refused::Failed to fetch tags from origin." >&2
                  exit 1
                fi
                if ! git tag --points-at HEAD | grep -Fxq "$candidate_tag"; then
                  echo "::error title=Release Refused::Dispatch release tag $candidate_tag does not point to checked-out HEAD." >&2
                  exit 1
                fi
                if ! git fetch origin main --depth=100; then
                  echo "::error title=Release Refused::Failed to fetch origin/main." >&2
                  exit 1
                fi
                if ! git merge-base --is-ancestor HEAD origin/main 2>/dev/null && [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main 2>/dev/null)" ]; then
                  echo "::error title=Release Refused::Dispatch release tag $candidate_tag is not reachable from origin/main." >&2
                  exit 1
                fi
                release_tag="$candidate_tag"
              else
                case "$REF" in
                  refs/tags/*)
                    candidate_tag="$REF_NAME"
                    if [[ "$candidate_tag" =~ [$'\r\n'] ]] || ! [[ "$candidate_tag" =~ $tag_pattern ]]; then
                      echo "::error title=Release Refused::Pushed tag $candidate_tag is not a valid release tag format." >&2
                      exit 1
                    fi
                    if ! git fetch origin main --depth=100; then
                      echo "::error title=Release Refused::Failed to fetch origin/main." >&2
                      exit 1
                    fi
                    if ! git merge-base --is-ancestor HEAD origin/main 2>/dev/null && [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main 2>/dev/null)" ]; then
                      echo "::error title=Release Refused::Pushed tag $candidate_tag is not reachable from origin/main." >&2
                      exit 1
                    fi
                    release_tag="$candidate_tag"
                    ;;
                  refs/heads/main)
                    if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "schedule" ]; then
                      raw_tag=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -n1 || true)
                      if [ -n "$raw_tag" ] && [[ ! "$raw_tag" =~ [$'\r\n'] ]] && [[ "$raw_tag" =~ $tag_pattern ]]; then
                        release_tag="$raw_tag"
                      fi
                    fi
                    ;;
                esac
              fi
              if [ -n "$release_tag" ]; then
                echo "Validated release tag $release_tag at HEAD; this run builds and publishes the release."
                is_release=true
              fi
              if [[ "$release_tag" == *-canary.* ]]; then
                channel=canary
              fi
              {
                echo "is-release=$is_release"
                echo "release-tag=$release_tag"
                echo "channel=$channel"
              } >> "$GITHUB_OUTPUT"

   check:
      name: Lint, type check & web build
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'rust' }}
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         # Owner approval provenance (OMP-295): the Work contract approval
         # (approval.json) may only be introduced or changed by owner approval
         # commits (flood-owner + owner marker). Unshallows the base branch so
         # the check can walk base..head.
         - name: Approval provenance (approval.json only in owner approval commits)
           if: github.event_name == 'pull_request'
           shell: bash
           env:
              BASE_REF: ${{ github.base_ref }}
           run: |
              set -euo pipefail
              git fetch --no-tags --unshallow origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
              bun scripts/approval-provenance.ts --base "origin/${BASE_REF}"
         # Standing upstream-compatibility guardrail (OMP-229).
         # Every PR: the fork-behavior inventory must account for every path
         # diverging from the accepted upstream baseline — fork behavior cannot
         # change without a corresponding inventory update.
         # Upstream-update PRs (any PR touching docs/upstream-baseline.json or a
         # docs/upstream-review-<sha12>.json record): additionally run the full
         # record review per changed record, strict (no pending proofs), fetching
         # that record's own base/fork/target pins first and failing with the
         # itemized incompatibility report in the step summary.
         - name: Upstream guardrail (inventory consistency / full review)
           if: github.event_name == 'pull_request'
           shell: bash
           env:
              GH_TOKEN: ${{ github.token }}
              PR_NUMBER: ${{ github.event.pull_request.number }}
           run: |
              set -euo pipefail
              baseline=docs/upstream-baseline.json
              # Fetch one pinned commit using the given record's own upstream repo
              # (present in origin after acceptance; in upstream before).
              fetch_commit() { # $1 = record path, $2 = commit sha
                git cat-file -e "$2^{commit}" 2>/dev/null && return 0
                local repo
                repo="$(jq -er '.upstream_repo | select(test("^https://github\\.com/"))' "$1")"
                git fetch --depth=1 origin "$2" 2>/dev/null || git fetch --depth=1 "$repo" "$2"
              }
              record_pin() { # $1 = record path, $2 = field (base|fork|target)
                jq -er --arg f "$2" '.[$f] | select(test("^[0-9a-f]{40}$"))' "$1"
              }
              run_strict_review() { # $1 = record path
                fetch_commit "$1" "$(record_pin "$1" base)"
                fetch_commit "$1" "$(record_pin "$1" fork)"
                fetch_commit "$1" "$(record_pin "$1" target)"
                if ! bun scripts/verify-upstream-handoff.ts --record "$1" --report /tmp/incompatibility-report.md; then
                  cat /tmp/incompatibility-report.md >> "$GITHUB_STEP_SUMMARY" || true
                  exit 1
                fi
              }
              # The inventory check needs the accepted baseline's target commit locally.
              fetch_commit "$baseline" "$(record_pin "$baseline" target)"
              bun scripts/upstream-inventory.ts
              # gh pr diff (and the list-files API) cap the file count, and every
              # upstream intake PR exceeds it. Diff the PR's own changes, the
              # three-dot range between the merge parents
              # ($GITHUB_SHA^1...$GITHUB_SHA^2): a diff of the merge result
              # against the first parent misses a file the base already has.
              # A shallow checkout has neither parent nor their merge-base, so
              # unshallow that commit. No `|| true`, so set -e fails the step
              # on a fetch or git error instead of skipping the strict review.
              if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
                git fetch --no-tags --unshallow origin "$GITHUB_SHA"
              fi
              changed_files="$(git diff --name-only "$GITHUB_SHA^1...$GITHUB_SHA^2")"
              if grep -qx "$baseline" <<<"$changed_files"; then
                echo "baseline record changed — running the full standing-guardrail review (strict)"
                run_strict_review "$baseline"
              fi
              changed_reviews="$(grep -E '^docs/upstream-review-[0-9a-f]{12}\.json$' <<<"$changed_files" || true)"
              while IFS= read -r review_record; do
                [ -n "$review_record" ] || continue
                echo "review record changed — running the full standing-guardrail review (strict): $review_record"
                run_strict_review "$review_record"
              done <<<"$changed_reviews"
         - name: Verify Rust license compliance (cargo-deny 0.20.2)
           run: |
              # Prebuilt release binary checked against digests pinned here:
              # `cargo install` compiled cargo-deny from source on every run
              # (~135 s), and a .sha256 fetched from the same mutable release
              # would prove transport integrity only. Bump ver and both
              # digests together.
              ver=0.20.2
              case "$(uname -m)" in
                x86_64) arch=x86_64 sha=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f ;;
                aarch64|arm64) arch=aarch64 sha=995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d ;;
                *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
              esac
              name="cargo-deny-$ver-$arch-unknown-linux-musl"
              curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$ver/$name.tar.gz"
              echo "$sha  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
              tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
              mkdir -p "$HOME/.cargo/bin"
              install -m 0755 "$RUNNER_TEMP/$name/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
              # `--offline` needs every workspace crate already in the registry
              # cache. PR runs use a fresh GitHub-hosted runner (see runs-on
              # above) with no prior cargo work, so nothing populates the index
              # for our own graph and resolution fails. Non-PR events land on
              # the self-hosted rust runner, whose Cargo cache is warm. Fetch first.
              cargo fetch --locked
              cargo deny --locked --offline check licenses sources
         # OMP-451: a test reading a file that exists only on the dev host
         # passed locally and failed on the runner.
         - name: Guard tests against external absolute-path reads
           run: |
              bun test scripts/check-test-external-reads.test.ts
              bun scripts/check-test-external-reads.ts
         - name: Type check workspace
           run: bun run ci:check:full
         - name: Build collab web
           run: bun run collab:web:build

   # MODULE.bazel.lock caches the crate_universe (@crates) extension result,
   # keyed by Cargo.toml/Cargo.lock/member-manifest hashes. While current, a
   # fresh bazel server skips the extension entirely; once stale, every bazel
   # job here re-runs `cargo-bazel splice` (~240 s each, CI run 36255186857).
   # Stale is slow, never wrong, so this job only makes drift visible — PRs
   # that touch Cargo files get told to run `bun run gen:bazel-lock`. The
   # check compares hashes only (no splice); on failure the job evaluates the
   # extension once and uploads the refreshed lockfile, so a contributor
   # without bazelisk can commit it as-is.
   bazel_lock:
      name: Check MODULE.bazel.lock freshness
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Check crate_universe entry
           run: bun scripts/gen-bazel-lock.ts --check
         - name: Refresh MODULE.bazel.lock
           if: failure()
           run: bun scripts/gen-bazel-lock.ts
         - name: Upload refreshed MODULE.bazel.lock
           if: failure()
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: MODULE.bazel.lock
              path: MODULE.bazel.lock

   # Rust validation (tests, clippy, rustfmt) runs on non-PR events only.
   # Native-changing PRs are rare enough that they do not warrant PR-side
   # Rust validation or a PR-side addon build (see native_addons): Rust is
   # validated post-merge on main (self-hosted rust runner, warm) and again at
   # release. A skipped required check still satisfies branch protection.
   rust_validate:
      name: Validate Rust workspace (bazel)
      if: github.event_name != 'pull_request'
      runs-on: rust
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - id: cache
           uses: ./.github/actions/bazel-cache
           with:
              scope: linux
         - name: Rust tests
           # The ulimit guard runs in the step that launches the bazel server
           # (limits are per-process and the server persists across steps).
           run: |
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" test //crates/...
         # Clippy scope mirrors `cargo clippy --workspace` (libraries only, no
         # test targets) plus the strict/default split: crates with
         # `[lints] workspace = true` get the workspace policy, except
         # brush-core (a vendored fork excluded from the Cargo task too).
         # pi-builtins allows every clippy group in its own manifest (ported
         # brush/uutils/jaq code) but is still held to zero rustc warnings;
         # Cargo honors that via `[lints]`, Bazel via the clippy-ported config.
         - name: Clippy (workspace lint policy on opted-in crates)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/pi-ast/... + //crates/pi-diff/... + //crates/pi-edit/... + //crates/pi-iso/... + //crates/pi-natives/... + //crates/pi-shell/... + //crates/pi-vcs/... + //crates/pi-voice/... + //crates/pi-walker/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy-strict --
         - name: Clippy (default lints elsewhere)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/... - (//crates/pi-ast/... + //crates/pi-diff/... + //crates/pi-edit/... + //crates/pi-iso/... + //crates/pi-natives/... + //crates/pi-shell/... + //crates/pi-vcs/... + //crates/pi-voice/... + //crates/pi-walker/...) - //crates/pi-builtins/... - //crates/vendor/brush-core/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy --
         - name: Clippy (manifest allows on ported pi-builtins)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/pi-builtins/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy-ported --
         - name: Rustfmt
           run: bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=rustfmt //crates/...

   # Provides the linux-x64 addon pair every downstream TS job installs.
   #
   # PRs never build. They restore the pair main built for the same native
   # sources from actions/cache (key = hash of every native build input, the
   # same file set as the bazel-cache action's config+source hashes). With no
   # exact entry (the PR changes native inputs, or main has not built this
   # state yet) they take main's newest entry, and with no entry at all the
   # latest npm release. The workspace loader skips its version sentinel for
   # workspace loads, so any of these load under a newer checkout. Testing
   # against main's build instead of the last release keeps merged-but-
   # unreleased native fixes from failing every PR that did not touch Rust
   # (a merged grep fix plus its TS test failed 75 PR runs against the
   # 18.3.1 addon). Only main saves; see the save step for why.
   #
   # Main (kata, cluster remote cache) builds only the pair here so the TS
   # fan-out starts as soon as it links; native_addons_cross builds the other
   # Linux-hosted targets in parallel. Job name says "bazel" for continuity
   # with required checks.
   native_addons:
      name: Build native addons (bazel)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'rust' }}
      # actions: write lets main prune superseded addon cache entries.
      permissions:
         contents: read
         actions: write
      outputs:
         # "<artifact-relative path>=<sha256>" pairs; kata consumers restore
         # these from the in-cluster stash (see native-artifacts).
         stash: ${{ steps.stage.outputs.stash }}
      steps:
         - uses: actions/checkout@v4
         - name: Compute native addon cache key
           id: natives-key
           shell: bash
           env:
              # Must stay identical on every event: PRs look up the entry main
              # saved for the same inputs. Mirrors the bazel-cache hash inputs.
              NATIVE_INPUTS_HASH: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'rust-toolchain.toml', 'rustfmt.toml', '.bazelrc', '.bazelignore', '.bazelversion', 'bazel/**', 'crates/**', 'BUILD.bazel') }}
           run: |
              echo "prefix=natives-linux-x64-v1-" >> "$GITHUB_OUTPUT"
              echo "key=natives-linux-x64-v1-$NATIVE_INPUTS_HASH" >> "$GITHUB_OUTPUT"

         # ---- PR path: main-built addons from actions/cache, else npm ----
         # `ci-natives` is a plain workspace-relative path on purpose: the
         # cache version hashes the literal path list, so kata (save) and
         # hosted (restore) must spell it identically, and upload-artifact
         # skips dot-directories by default.
         - name: Restore main-built native addons
           id: natives-cache
           if: github.event_name == 'pull_request'
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives
              key: ${{ steps.natives-key.outputs.key }}
              restore-keys: |
                 ${{ steps.natives-key.outputs.prefix }}
         - name: Fetch release native addons (npm)
           if: github.event_name == 'pull_request' && steps.natives-cache.outputs.cache-matched-key == ''
           shell: bash
           run: |
              set -euo pipefail
              native_version="$(node -p "require('./packages/natives/package.json').version")"
              tarball="$(npm view "@oh-my-pi/pi-natives-linux-x64@$native_version" dist.tarball)"
              echo "Fetching @oh-my-pi/pi-natives-linux-x64@$native_version from $tarball"
              curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
              mkdir -p ci-natives/natives-linux-x64-baseline ci-natives/natives-linux-x64-modern
              cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" ci-natives/natives-linux-x64-baseline/
              cp "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" ci-natives/natives-linux-x64-modern/
         # Make the addon source visible whenever it is not source-matched,
         # instead of leaving a reviewer to wonder which addons the tests ran.
         - name: Report native addon source
           if: github.event_name == 'pull_request'
           shell: bash
           env:
              EXACT: ${{ steps.natives-cache.outputs.cache-hit }}
              MATCHED: ${{ steps.natives-cache.outputs.cache-matched-key }}
           run: |
              if [ "$EXACT" = true ]; then
                echo "Using main's addons for this exact native source state ($MATCHED)."
              elif [ -n "$MATCHED" ]; then
                echo "::notice title=Native addons not source-matched::No main build matches this PR's native sources; testing against main's newest addon build ($MATCHED). Native changes are validated post-merge on main and at release."
              else
                echo "::notice title=Native addons from npm::No main-built addon cache entry is available; testing against the latest npm release addons."
              fi

         # ---- main path: bazel build of the linux-x64 pair ----
         - id: cache
           if: github.event_name != 'pull_request'
           uses: ./.github/actions/bazel-cache
           with:
              scope: linux
         - name: Build linux-x64 native addons
           if: github.event_name != 'pull_request'
           run: |
              set -eo pipefail
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              # The addon cdylib links each peak at several GiB of rustc RSS;
              # building several addons in one invocation runs them
              # concurrently, which OOMs the kata pod and takes the bazel
              # server with it (exit 37 "Server terminated abruptly", runs
              # 30556752623 / 30557524371). Build one addon per invocation —
              # analysis and cached actions are shared through the persistent
              # server, so only the heavy links serialize.
              : > "$RUNNER_TEMP/bazel-build.log"
              for target in $NATIVES_X64_TARGETS; do
                bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build "//:$target" 2>&1 | tee -a "$RUNNER_TEMP/bazel-build.log"
              done
              for target in $NATIVES_X64_TARGETS; do
                mkdir -p "ci-natives/$target"
                cp -L bazel-bin/"$target"/*.node "ci-natives/$target/"
              done
         # Cache-hit visibility: a supposedly warm build that executes
         # thousands of actions is the failure mode that made CI slow — make
         # it visible in the run summary instead of discovering it weeks in.
         - name: Report bazel cache stats
           if: github.event_name != 'pull_request'
           shell: bash
           run: |
              # Bazel runs with --color=yes (config=ci); strip ANSI before
              # matching — escapes split "INFO:" from the process count in
              # the raw log.
              summary=$(sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/bazel-build.log" | grep -E '[0-9]+ processes:' | tail -1 || true)
              echo "::notice title=Bazel build summary::${summary:-no process summary found}"

         # ---- both paths ----
         # A corrupt download or cache entry must fail here, not as a
         # confusing dlopen error in every downstream test shard.
         - name: Smoke native addons
           shell: bash
           env:
              # OMP-237: the npm fallback is pinned to the repository version, so
              # those addons must report exactly that release. Main-built addons
              # restored from the cache only need to load (upstream policy).
              PINNED_NPM_ADDONS: ${{ github.event_name == 'pull_request' && steps.natives-cache.outputs.cache-matched-key == '' && '1' || '' }}
           run: |
              set -euo pipefail
              # NOTE: `bun -e 'require("./x.node")'` swallows dlopen failures
              # (exit 0 on a bogus addon); a script file enforces them in
              # both bun and node. Verified against a corrupt .node fixture.
              cat > "$RUNNER_TEMP/smoke-addons.js" <<'EOF'
              const expectedVersion = process.env.PINNED_NPM_ADDONS ? process.argv[2] : "";
              const legacySentinel = `__piNativesV${process.argv[2].replace(/[^A-Za-z0-9]/g, "_")}`;
              for (const f of process.argv.slice(3)) {
                const m = require(f);
                if (!m || Object.keys(m).length === 0) {
                  console.error(`addon failed to load: ${f}`);
                  process.exit(1);
                }
                if (expectedVersion) {
                  const reported =
                    typeof m.__piNativesBuildVersion === "function"
                      ? m.__piNativesBuildVersion()
                      : typeof m[legacySentinel] === "function"
                        ? expectedVersion
                        : null;
                  if (reported !== expectedVersion) {
                    console.error(`addon does not report repository version ${expectedVersion}: ${f} (${reported})`);
                    process.exit(1);
                  }
                }
              }
              EOF
              loader=node
              if command -v bun >/dev/null 2>&1; then loader=bun; fi
              "$loader" "$RUNNER_TEMP/smoke-addons.js" \
                "$(node -p "require('./packages/natives/package.json').version")" \
                "$PWD/ci-natives/natives-linux-x64-baseline/pi_natives.linux-x64-baseline.node" \
                "$PWD/ci-natives/natives-linux-x64-modern/pi_natives.linux-x64-modern.node"
         # Kata test jobs download ~120 MB of artifact over the node's NAT
         # egress (44-68 s per job, on the critical path). Every kata pod
         # mounts the shared runner-cache PVC at /opt/bazel-repo-cache (the
         # xwin cache already lives there), so stash the pair content-addressed
         # beside it; the native-artifacts action restores and re-verifies it
         # and falls back to the artifact on any miss. Best-effort: a stash
         # failure only costs consumers the download.
         - name: Stage native addons for consumers
           id: stage
           shell: bash
           run: |
              set -euo pipefail
              stash=""
              for f in ci-natives/natives-linux-x64-*/*.node; do
                sha="$(sha256sum "$f" | cut -d' ' -f1)"
                stash="$stash ${f#ci-natives/}=$sha"
              done
              echo "stash=${stash# }" >> "$GITHUB_OUTPUT"
              stash_dir=/opt/bazel-repo-cache/ci-natives
              if [ -z "${BAZEL_REMOTE_USER:-}" ] || [ ! -w /opt/bazel-repo-cache ]; then
                echo "No in-cluster stash on this runner; consumers download the artifact."
                exit 0
              fi
              if ! mkdir -p "$stash_dir"; then
                echo "::warning title=Native addon stash::cannot create $stash_dir; consumers will download the artifact"
                exit 0
              fi
              # Consumers of a run need its entries for minutes; two days
              # covers re-runs while bounding the PVC footprint.
              find "$stash_dir" -type f -mmin +2880 -delete 2>/dev/null || true
              for entry in ${stash# }; do
                rel="${entry%%=*}"
                sha="${entry##*=}"
                dest="$stash_dir/$sha.node"
                if [ -f "$dest" ]; then
                  touch "$dest"
                  continue
                fi
                tmp="$stash_dir/.$sha.$$.tmp"
                if cp "ci-natives/$rel" "$tmp" && mv -f "$tmp" "$dest"; then
                  echo "stashed $rel -> $dest"
                else
                  rm -f "$tmp"
                  echo "::warning title=Native addon stash::could not stash $rel; consumers will download the artifact"
                fi
              done
         # Only main saves: an entry saved on any other ref is readable by
         # that ref alone yet counts against the shared 10 GB repo quota,
         # whose LRU eviction has already cost the darwin release archives.
         # Probe first so an existing entry is not re-uploaded, then keep
         # only the newest two entries so the footprint stays ~100 MB.
         # The three steps below run only on main (never exercised by PR or
         # branch runs) and are pure optimization for later PRs: a failure
         # must never fail native_addons and with it every test job.
         - name: Probe native addon cache entry
           id: natives-cache-probe
           if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
           continue-on-error: true
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives
              key: ${{ steps.natives-key.outputs.key }}
              lookup-only: true
         - name: Save native addon cache entry
           if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.natives-cache-probe.outputs.cache-hit != 'true'
           continue-on-error: true
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives
              key: ${{ steps.natives-key.outputs.key }}
         - name: Prune superseded native addon cache entries
           if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.natives-cache-probe.outputs.cache-hit != 'true'
           continue-on-error: true
           shell: bash
           env:
              GH_TOKEN: ${{ github.token }}
              PREFIX: ${{ steps.natives-key.outputs.prefix }}
           run: |
              # Best-effort: a failed prune leaves eviction to GitHub's LRU.
              gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$PREFIX" \
                  --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' \
                | while read -r id; do
                    gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
                  done || true

         - name: Upload linux-x64 native addon artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: natives-linux-x64
              path: ci-natives/natives-linux-x64-*/*.node
              if-no-files-found: error
              retention-days: 1

   # The remaining Linux-hosted targets (arm64, musl, win32 cross). Only
   # release jobs consume them, so they build beside the TS fan-out instead of
   # ahead of it: serially after the pair they held every test job back ~10
   # min on native-changing main pushes. Non-PR only, like rust_validate;
   # the build also keeps the remote cache warm for release runs.
   native_addons_cross:
      name: Build native addons (bazel, cross targets)
      if: github.event_name != 'pull_request'
      runs-on: rust
      steps:
         - uses: actions/checkout@v4
         - id: cache
           uses: ./.github/actions/bazel-cache
           with:
              scope: linux
         - name: Build cross-target native addons
           run: |
              set -eo pipefail
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              # One addon per invocation, for the OOM reason in native_addons.
              : > "$RUNNER_TEMP/bazel-build.log"
              for target in $NATIVES_CROSS_TARGETS; do
                bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build "//:$target" 2>&1 | tee -a "$RUNNER_TEMP/bazel-build.log"
              done
         # The two jobs' target lists must together cover //:natives-linux-all
         # exactly; a target added to the filegroup but to neither list would
         # otherwise silently never build or ship. cquery, not query: the rc's
         # --config=ci is defined for build only, which cquery inherits and
         # query rejects; this also reuses the warm server.
         - name: Check addon target lists cover natives-linux-all
           run: |
              set -euo pipefail
              read -r -a listed <<< "$NATIVES_X64_TARGETS $NATIVES_CROSS_TARGETS"
              expected="$(printf '%s\n' "${listed[@]}" | sort)"
              actual="$(bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" cquery 'labels(srcs, //:natives-linux-all)' 2>"$RUNNER_TEMP/query.err" | sed -E 's/ \(.*\)$//; s/.*://' | sort)" || {
                cat "$RUNNER_TEMP/query.err"
                exit 1
              }
              if [ "$expected" != "$actual" ]; then
                echo "::error title=Native addon target lists::NATIVES_X64_TARGETS + NATIVES_CROSS_TARGETS must equal //:natives-linux-all srcs"
                diff <(echo "$expected") <(echo "$actual") || true
                exit 1
              fi
         - name: Report bazel cache stats
           shell: bash
           run: |
              summary=$(sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/bazel-build.log" | grep -E '[0-9]+ processes:' | tail -1 || true)
              echo "::notice title=Bazel build summary::${summary:-no process summary found}"
         # Everything except the linux-x64 pair, which native_addons ships as
         # its own small `natives-linux-x64` artifact.
         - name: Upload remaining native addon artifacts
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: native-addons
              path: |
                 bazel-bin/natives-*/*.node
                 !bazel-bin/natives-linux-x64-*/*.node
              if-no-files-found: error
              retention-days: 7

   test_coding_agent_native:
      name: "Test coding-agent native/unit (TS) ${{ matrix.shard }}"
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'rust' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      # The longest PR job, so it runs as three shards on hosted PR runners
      # (two left the slower shard ~25 s behind every other job). Main keeps
      # one: omp-kata caps at 8 runners and the fan-out already fills it.
      # Declared first among the test jobs: when the 8-runner pool is full
      # the longest bucket should not be the one left queued (probe run
      # 36238796966 queued it 1.9 min behind the shorter buckets).
      # No required check keys on this job name (branch protection and
      # rulesets are off for main/omp2), so the per-shard names are safe.
      strategy:
         fail-fast: false
         matrix:
            shard: ${{ fromJSON(github.event_name == 'pull_request' && '["1/3","2/3","3/3"]' || '["1/1"]') }}
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Test coding-agent native/unit bucket
           env:
              OMP_TEST_CONCURRENCY: "4"
              OMP_TEST_SHARD: ${{ matrix.shard }}
           run: bun run ci:test:coding-agent:native

   # Fork branch protection requires a check named "Test coding-agent native/unit (TS)". Upstream 18.4.8 sharded that
   # job (per-shard names), so this job reports the required name and passes only when every shard passed.
   test_coding_agent_native_required:
      name: Test coding-agent native/unit (TS)
      runs-on: ubuntu-22.04
      needs: [test_coding_agent_native]
      if: ${{ always() }}
      steps:
         - name: Require every native/unit shard to pass
           env:
              SHARDS_RESULT: ${{ needs.test_coding_agent_native.result }}
           run: |
              echo "native/unit shards: $SHARDS_RESULT"
              test "$SHARDS_RESULT" = success

   test_workspace:
      name: Test TS workspace fast
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'rust' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Test workspace packages and repo scripts (TS)
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: |
              bun run ci:test:ts:workspace
              bun run test:scripts

   test_coding_agent_singleton:
      name: Test coding-agent singleton/global-state (TS)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'rust' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Test coding-agent singleton/global-state bucket
           # Keep global Settings/env/fake-timer tests serial; native addon
           # artifacts are still available like every other coding-agent bucket.
           run: bun run ci:test:coding-agent:singleton

   test_ts_native:
      name: Test TS native/integration packages
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'rust' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Test native/TUI/browser-ish packages (TS)
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: bun run ci:test:ts:native

   test_coding_agent_ui:
      name: Test coding-agent UI/TUI (TS)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'rust' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Test coding-agent UI/TUI bucket
           env:
              OMP_TEST_CONCURRENCY: "2"
           run: bun run ci:test:coding-agent:ui

   test_coding_agent_runtime:
      name: Test coding-agent runtime/session (TS)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'rust' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Test coding-agent runtime bucket
           # Runtime/session tests import native-backed barrels too; keep this
           # separate for concurrency, not as a native-free guardrail.
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: bun run ci:test:coding-agent:runtime

   test_smoke:
      name: Test CLI smoke (TS)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'rust' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 15
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: CLI smoke test
           run: bun run ci:test:smoke

   install_methods:
      name: Install method smoke tests
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'rust' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Install method smoke tests
           env:
              OMP_INSTALL_TEST_SKIP_NATIVE_BUILD: "1"
           run: bun run ci:test:install-methods

   # Aggregates every validation job so publish-side release jobs gate on one
   # result. Binary BUILDS deliberately do not wait for this gate — they run
   # in parallel with the test fan-out and only publishing is held back.
   release_gate:
      name: Release validation gate
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.rust_validate.result == 'success' &&
         needs.native_addons.result == 'success' &&
         needs.native_addons_cross.result == 'success' &&
         needs.test_workspace.result == 'success' &&
         needs.test_coding_agent_singleton.result == 'success' &&
         needs.test_ts_native.result == 'success' &&
         needs.test_coding_agent_ui.result == 'success' &&
         needs.test_coding_agent_runtime.result == 'success' &&
         needs.test_coding_agent_native.result == 'success' &&
         needs.test_smoke.result == 'success' && needs.check.result == 'success' &&
         needs.work_ledger_postgres.result == 'success' &&
         needs.install_methods.result == 'success' }}
      needs: [release_metadata, check, rust_validate, native_addons, native_addons_cross, test_workspace, test_coding_agent_singleton, test_ts_native, test_coding_agent_ui, test_coding_agent_runtime, test_coding_agent_native, test_smoke, install_methods, work_ledger_postgres]
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         # Generated-config drift gate: bazel/clippy.bazelrc is maintained by
         # scripts/release.ts (like the lockfiles); a stale file only blocks
         # publishing, never ordinary CI.
         - name: Check generated clippy config
           run: bun scripts/gen-clippy-bazelrc.ts --check
         - run: echo "release validation green"

   # Builds (does not publish) the Linux-hosted release binaries in parallel
   # with the test fan-out; the needs are the two native_addons jobs, whose
   # artifacts supply their addons. Native-host builds live in
   # release_binary_hosted and start at release_metadata time instead.
   # Publishing (npm leaves, GitHub release, core npm) is gated on
   # release_gate downstream.
   release_binary:
      name: "Release binary: ${{ matrix.target_id }}"
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.native_addons.result == 'success' &&
         needs.native_addons_cross.result == 'success' }}
      needs: [release_metadata, native_addons, native_addons_cross]
      strategy:
         fail-fast: false
         matrix:
            include:
               - {
                    os: ubuntu-22.04,
                    platform: linux,
                    arch: x64,
                    target_id: linux-x64,
                    binary_path: packages/coding-agent/binaries/omp-linux-x64,
                    native_targets: linux-x64-baseline linux-x64-modern,
                 }
               - {
                    os: ubuntu-22.04,
                    platform: linux,
                    libc: musl,
                    arch: x64,
                    target_id: linux-musl-x64,
                    binary_path: packages/coding-agent/binaries/omp-linux-musl-x64,
                    native_targets: linux-musl-x64-baseline,
                 }
               - {
                    os: ubuntu-24.04-arm,
                    platform: linux,
                    arch: arm64,
                    target_id: linux-arm64,
                    binary_path: packages/coding-agent/binaries/omp-linux-arm64,
                    native_targets: linux-arm64,
                 }
               - {
                    os: ubuntu-24.04-arm,
                    platform: linux,
                    libc: musl,
                    arch: arm64,
                    target_id: linux-musl-arm64,
                    binary_path: packages/coding-agent/binaries/omp-linux-musl-arm64,
                    native_targets: linux-musl-arm64,
                 }
               - {
                    os: ubuntu-22.04,
                    platform: win32,
                    arch: x64,
                    target_id: win32-x64,
                    binary_path: packages/coding-agent/binaries/omp-windows-x64.exe,
                    native_targets: win32-x64-baseline,
                 }
               # Addon cross-built by Bazel (clang-cl + xwin arm64 splat) in
               # native_addons_cross, binary cross-compiled by bun; the
               # release_smoke_win32_arm64 job runs it on real hardware.
               - {
                    os: ubuntu-22.04,
                    platform: win32,
                    arch: arm64,
                    target_id: win32-arm64,
                    binary_path: packages/coding-agent/binaries/omp-windows-arm64.exe,
                    native_targets: win32-arm64,
                 }
      runs-on: ${{ matrix.os }}
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Restore bun store
           id: bun-cache
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
              restore-keys: |
                 bun-${{ runner.os }}-
         - run: bun install --frozen-lockfile
         - name: Install prebuilt native addon(s)
           uses: ./.github/actions/native-artifacts
           with:
              targets: ${{ matrix.native_targets }}
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         # Windows binary is cross-built on Linux, so we have no Windows runner
         # to smoke it on. Cross-build correctness is verified via the bun
         # `--compile --target=bun-windows-x64-*` cross-compile. Musl binaries
         # need the musl loader, which glibc runners lack — they are smoked in
         # the Alpine container step below instead.
         - name: Smoke release binary
           if: matrix.platform != 'win32' && matrix.libc != 'musl'
           run: |
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --smoke-test
         - name: Smoke musl release binary on Alpine
           if: matrix.libc == 'musl'
           run: |
              binary="$(realpath "${{ matrix.binary_path }}")"
              # Bun's musl-target binaries link libstdc++/libgcc dynamically;
              # Alpine users install them alongside the binary (same as bun itself).
              docker run --rm -v "$binary:/usr/local/bin/omp:ro" alpine:3.22 sh -ec '
                apk add --no-cache libstdc++ libgcc >/dev/null
                runtime_dir="$(mktemp -d)"
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" omp --version
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" omp --smoke-test
              '
         - name: Upload release binary artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-binary-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}
         # Main-only save, after the build so it is off the leg's critical
         # path: caches saved on a tag or branch are readable only by that ref
         # yet count against the shared 10 GB quota (see bazel-cache).
         - name: Save bun store
           if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
           continue-on-error: true
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

   # Native-host builds make addons that native_addons cannot provide: Darwin
   # uses Bazel/Xcode (win32-arm64 now cross-builds on kata). They gate on
   # release_metadata alone and start as soon as a release is detected, fully
   # overlapped with the tests.
   #
   # darwin-x64 builds on Apple silicon: Xcode cross-compiles the x86_64 addon
   # and bun cross-compiles the binary, and the leg took 25-35 min on
   # macos-15-intel vs 11-16 min for darwin-arm64. It must be macos-15, not
   # macos-14: the smoke runs the x86_64 binary under Rosetta, and only
   # macOS 15's Rosetta translates the AVX2 the bun-darwin-x64 runtime uses
   # (macOS 14: "CPU lacks AVX support", SIGILL on --smoke-test).
   release_binary_hosted:
      name: "Release binary: ${{ matrix.target_id }}"
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() }}
      needs: [release_metadata]
      strategy:
         fail-fast: false
         matrix:
            include:
               - {
                    os: macos-15,
                    platform: darwin,
                    target_id: darwin-x64,
                    binary_path: packages/coding-agent/binaries/omp-darwin-x64,
                    native_targets: darwin-x64-baseline,
                    cache_scope: release-darwin-x64,
                    fallback_scope: "",
                 }
               # Apple Foundation Models needs Swift 6.4 and the macOS 27 SDK;
               # the xcode-27 image is arm64, so keep the Intel cross-build on
               # macos-15 and its own disk cache.
               - {
                    os: xcode-27,
                    platform: darwin,
                    target_id: darwin-arm64,
                    binary_path: packages/coding-agent/binaries/omp-darwin-arm64,
                    native_targets: darwin-arm64,
                    cache_scope: release-darwin-arm64-xcode27,
                    fallback_scope: "",
                 }
      runs-on: ${{ matrix.os }}
      permissions:
         contents: read
      env:
         MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Restore bun store
           id: bun-cache
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
              restore-keys: |
                 bun-${{ runner.os }}-
         - run: bun install --frozen-lockfile
         # Darwin addons use the host Xcode toolchain. The warm workflow keeps
         # these scopes seeded near HEAD, so this is normally the version-bump
         # delta. No save here: every release push also triggers
         # bazel-cache-warm, which builds and saves the same key concurrently;
         # release legs lost that race and spent 0.5-6.4 min compressing an
         # archive before "Unable to reserve cache" (18.3.2, 18.2.x).
         - name: Build native addon (bazel)
           if: matrix.platform == 'darwin'
           uses: ./.github/actions/bazel-natives
           with:
              targets: ${{ matrix.native_targets }}
              cache-scope: ${{ matrix.cache_scope }}
              fallback-scope: ${{ matrix.fallback_scope }}
              save: "false"
         - name: Verify Apple Foundation Models bridge
           if: matrix.target_id == 'darwin-arm64'
           run: |
              addon=packages/natives/native/pi_natives.darwin-arm64.node
              # The bridge is embedded as a separate dylib (module OmpAppleFm),
              # never linked: a linked Swift runtime crashes the addon on load
              # on older macOS.
              grep -aqF OmpAppleFm "$addon" ||
                 { echo "::error::Darwin arm64 addon was built without the Apple Foundation Models bridge"; exit 1; }
              if otool -L "$addon" | grep -E 'libswift|FoundationModels'; then
                 echo "::error::Darwin arm64 addon links the Swift runtime or FoundationModels directly"; exit 1
              fi
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         - name: Sign and notarize macOS binary (Developer ID)
           # Replaces the ad-hoc signature with a Developer ID + hardened-runtime
           # one while preserving the required JIT, Apple Events, and
           # library-validation entitlements, then notarizes. Auto-skips until
           # the APPLE_* secrets are configured.
           if: matrix.platform == 'darwin' && env.MACOS_SIGNING == 'true'
           env:
              APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
              APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
              APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
              APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
              APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
           run: bash scripts/ci-macos-sign.sh "${{ matrix.binary_path }}"
         - name: Smoke release binary
           if: matrix.platform == 'darwin'
           run: |
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --smoke-test
         # Native-host addons exist only on these runners; export them so
         # release_native_leaves can publish every leaf package after the
         # validation gate. Other leaves reuse the native_addons artifacts.
         - name: Upload native-host addon artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: native-addons-${{ matrix.target_id }}
              path: packages/natives/native/pi_natives.${{ matrix.target_id }}*.node
              if-no-files-found: error
              retention-days: 7
         - name: Upload release binary artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-binary-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}
         # Main-only save, after the build so it is off the critical path.
         - name: Save bun store
           if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
           continue-on-error: true
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

   # win32-arm64 is cross-built on Linux (addon: Bazel msvc arm64 toolchain;
   # binary: bun --compile); this runs it on real Windows ARM64 hardware
   # before anything publishes. Replaces the ~13-20 min native cargo leg.
   release_smoke_win32_arm64:
      name: "Smoke release binary: win32-arm64"
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_binary.result == 'success' }}
      needs: [release_metadata, release_binary]
      runs-on: windows-11-arm
      permissions:
         contents: read
      steps:
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: omp-binary-win32-arm64
              path: packages/coding-agent/binaries
         - name: Smoke release binary (Windows)
           shell: pwsh
           run: |
              $runtimeDir = Join-Path $env:RUNNER_TEMP "omp-smoke"
              $env:HOME = Join-Path $runtimeDir "home"
              $env:USERPROFILE = $env:HOME
              $env:LOCALAPPDATA = Join-Path $runtimeDir "local"
              $env:XDG_DATA_HOME = Join-Path $runtimeDir "xdg"
              New-Item -ItemType Directory -Force -Path $env:HOME, $env:LOCALAPPDATA, $env:XDG_DATA_HOME | Out-Null
              & "packages/coding-agent/binaries/omp-windows-arm64.exe" --version
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & "packages/coding-agent/binaries/omp-windows-arm64.exe" --smoke-test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

   # Publishes the six @oh-my-pi/pi-natives-<tag> leaf packages once
   # validation passes and every binary built. Runs on one linux runner: leaf
   # publishing is platform-agnostic file packaging (gen-npm-packages reads
   # packages/natives/native), so no per-platform runners are needed.
   release_native_leaves:
      name: Publish native leaf packages
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_gate.result == 'success' &&
         needs.release_binary.result == 'success' &&
         needs.release_binary_hosted.result == 'success' &&
         needs.release_smoke_win32_arm64.result == 'success' &&
         !inputs.skip_npm }}
      needs: [release_metadata, release_gate, release_binary, release_binary_hosted, release_smoke_win32_arm64]
      runs-on: ubuntu-22.04
      # id-token lets npm mint the OIDC token for trusted publishing; the
      # NODE_AUTH_TOKEN below is the fallback for unconfigured packages.
      permissions:
         id-token: write
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         # npm runs under Bun when invoked by the release script; npm 12
         # requires a newer emulated Node version than Bun 1.3 provides.
         - name: Ensure npm supports trusted publishing
           run: npm install -g npm@11.17.0
         - name: Restore bun store
           id: bun-cache
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
              restore-keys: |
                 bun-${{ runner.os }}-
         - run: bun install --frozen-lockfile
         # Main-only save: caches saved on a tag or branch are readable only by
         # that ref yet count against the shared 10 GB quota (see bazel-cache).
         - name: Save bun store
           if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         # Linux + win32-x64 addons from the native_addons artifact (gnu targets
         # only — musl reuses the linux filenames and has no leaf package).
         - name: Install linux and win32-x64 native addons
           uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern linux-arm64 win32-x64-baseline win32-arm64
         # Native-host addons come flat (canonical filenames) from the
         # release_binary_hosted legs.
         - name: Install native-host addons
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: native-addons-*
              path: packages/natives/native
              merge-multiple: true
         - name: Publish native leaf packages
           env:
              # Fallback auth: setup-node wrote an .npmrc referencing
              # NODE_AUTH_TOKEN; npm uses it only when OIDC has no trusted
              # publisher for the package (or on a first publish).
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
           # The six leaves are independent: each process generates its own
           # packages/natives/npm/<tag> dir and packs into a private temp dir,
           # and the legal payload is tracked in packages/natives, so nothing
           # shared is written. Serially they cost ~140 s on the release
           # critical path. Every leaf runs to completion so one failure does
           # not strand the others half-published; reruns skip published ones.
           run: |
              set -uo pipefail
              logs="$RUNNER_TEMP/native-leaf-logs"
              mkdir -p "$logs"
              tags=(linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64)
              pids=()
              for tag in "${tags[@]}"; do
                bun run ci:release:publish-native-leaf "$tag" >"$logs/$tag.log" 2>&1 &
                pids+=("$!")
              done
              failed=()
              for i in "${!tags[@]}"; do
                tag="${tags[$i]}"
                if wait "${pids[$i]}"; then
                  status=ok
                else
                  status="failed (exit $?)"
                  failed+=("$tag")
                fi
                echo "::group::$tag: $status"
                cat "$logs/$tag.log"
                echo "::endgroup::"
              done
              if [ "${#failed[@]}" -gt 0 ]; then
                echo "::error title=Native leaf publish::failed: ${failed[*]}"
                exit 1
              fi

   release_github:
      name: Publish GitHub release
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_gate.result == 'success' &&
         needs.release_binary.result == 'success' &&
         needs.release_binary_hosted.result == 'success' &&
         needs.release_smoke_win32_arm64.result == 'success' }}
      needs: [release_metadata, release_gate, release_binary, release_binary_hosted, release_smoke_win32_arm64]
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Generate release notes from CHANGELOGs
           env:
              # `gh release list` (used to find the latest published GitHub
              # Release tag below the target so silent-tag changelog sections
              # roll forward — #2596) requires GH_TOKEN in Actions. Without
              # it gh exits non-zero and the script would degrade to legacy
              # single-version notes, defeating the recovery.
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              RELEASE_TAG: ${{ needs.release_metadata.outputs.release-tag }}
           run: bun scripts/ci-release-notes.ts "$RELEASE_TAG"
         - name: Download release binaries
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: omp-binary-*
              path: packages/coding-agent/binaries
              merge-multiple: true
         # Dependency-free build (bun APIs + zip only), so no `bun install`
         # is needed on this runner.
         - name: Build browser relay artifacts
           run: bun run --cwd packages/browser-relay build
         # Generated after every other release asset is in place and before
         # the release is created, so SHA256SUMS.txt itself ships as an asset
         # and covers every other file uploaded alongside it.
         - name: Generate checksums
           run: |
              bun run ci:release:checksums SHA256SUMS.txt \
                packages/coding-agent/binaries/omp-* \
                packages/browser-relay/dist/omp-browser-relay-extension.zip \
                LICENSE \
                THIRD-PARTY-NOTICES.txt
         - name: Create GitHub Release
           uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
           with:
              tag_name: ${{ needs.release_metadata.outputs.release-tag }}
              prerelease: ${{ needs.release_metadata.outputs.channel == 'canary' }}
              files: |
                 packages/coding-agent/binaries/omp-*
                 packages/browser-relay/dist/omp-browser-relay-extension.zip
                 LICENSE
                 THIRD-PARTY-NOTICES.txt
                 SHA256SUMS.txt
              body_path: release-notes.md
              generate_release_notes: true

   release_github_verify:
      name: Verify published release (macOS)
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_github.result == 'success' }}
      needs: [release_metadata, release_github]
      runs-on: macos-14
      permissions:
         contents: read
      env:
         MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
      steps:
         - name: Download published macOS arm64 binary
           env:
              RELEASE_TAG: ${{ needs.release_metadata.outputs.release-tag }}
           run: |
              curl -fsSL -o omp-darwin-arm64 "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/omp-darwin-arm64"
              chmod +x omp-darwin-arm64
         - name: Verify published macOS arm64 binary
           run: |
              codesign -dvvv ./omp-darwin-arm64
              codesign --verify --strict --verbose=4 ./omp-darwin-arm64
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" ./omp-darwin-arm64 --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" ./omp-darwin-arm64 --smoke-test
         - name: Assert signed release is not ad-hoc
           if: env.MACOS_SIGNING == 'true'
           run: |
              if codesign -dvvv ./omp-darwin-arm64 2>&1 | grep -qE "flags=.*adhoc|Signature=adhoc"; then
                echo "published binary is still ad-hoc signed (Developer ID signing did not run)" >&2
                exit 1
              fi
              # Gatekeeper assessment: a notarized Developer ID binary is accepted.
              # Informational — a bare (unstapled) Mach-O relies on the online ticket
              # lookup, so surface the result without gating the release on it.
              spctl -a -t exec -vv ./omp-darwin-arm64 || echo "spctl non-zero (expected for unstapled bare binary; ticket served online)"

   release_npm:
      name: Publish to npm
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_binary.result == 'success' &&
         needs.release_binary_hosted.result == 'success' &&
         needs.release_smoke_win32_arm64.result == 'success' &&
         needs.release_github_verify.result == 'success' &&
         needs.release_native_leaves.result == 'success' &&
         !inputs.skip_npm }}
      # release_native_leaves must finish first: the core package lists the
      # leaf packages as lockstep-versioned optionalDependencies, so installs
      # resolve them the moment the core version is live.
      needs: [release_metadata, release_binary, release_binary_hosted, release_smoke_win32_arm64, release_github_verify, release_native_leaves]
      runs-on: ubuntu-22.04
      # `id-token: write` lets npm mint the GitHub OIDC token it exchanges for a
      # short-lived publish token (trusted publishing + provenance). When a
      # package has no matching trusted publisher configured, npm silently falls
      # back to NODE_AUTH_TOKEN below — which also covers first-ever publishes.
      permissions:
         id-token: write
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         # npm runs under Bun when invoked by the release script; npm 12
         # requires a newer emulated Node version than Bun 1.3 provides.
         - name: Ensure npm supports trusted publishing
           run: npm install -g npm@11.17.0
         - name: Restore bun store
           id: bun-cache
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
              restore-keys: |
                 bun-${{ runner.os }}-
         - run: bun install --frozen-lockfile
         # Main-only save: caches saved on a tag or branch are readable only by
         # that ref yet count against the shared 10 GB quota (see bazel-cache).
         - name: Save bun store
           if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         # The prepack executes workspace code which loads the Linux x64
         # addon, so install the native_addons job's artifact before publishing.
         - name: Install prebuilt native addons
           uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Publish to npm
           env:
              # Fallback auth: setup-node wrote an .npmrc referencing
              # NODE_AUTH_TOKEN; npm uses it only when OIDC has no trusted
              # publisher for the package (or on a first publish).
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
           run: bun run ci:release:publish

   # Regenerate the Homebrew tap formula (can1357/homebrew-tap) from the freshly
   # published release assets and push it. Gated on release_github_verify so the
   # tap only cuts over to a release whose published binary was verified (matches
   # how release_npm is gated). No-ops when HOMEBREW_TAP_DEPLOY_KEY is unset, so a
   # release never blocks on tap access.
   release_brew:
      name: Update Homebrew tap
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_metadata.outputs.channel != 'canary' &&
         needs.release_github_verify.result == 'success' }}
      needs: [release_metadata, release_github_verify]
      runs-on: ubuntu-22.04
      env:
         HAS_TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           if: env.HAS_TAP_KEY == 'true'
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           if: env.HAS_TAP_KEY == 'true'
         - name: Check out the Homebrew tap
           if: env.HAS_TAP_KEY == 'true'
           uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              repository: can1357/homebrew-tap
              ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
              path: homebrew-tap
         - name: Regenerate and push the formula
           if: env.HAS_TAP_KEY == 'true'
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              RELEASE_TAG: ${{ needs.release_metadata.outputs.release-tag }}
           run: |
              bun scripts/ci-update-brew-formula.ts "$RELEASE_TAG" --out homebrew-tap/Formula/omp.rb
              cd homebrew-tap
              if git diff --quiet -- Formula/omp.rb; then
                echo "formula already up to date for $RELEASE_TAG"
                exit 0
              fi
              git -c user.name="github-actions[bot]" \
                  -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit -m "omp $RELEASE_TAG" -- Formula/omp.rb
              git push origin HEAD:main

   work_ledger_postgres:
      name: Work Ledger PostgreSQL integration
      runs-on: ubuntu-22.04
      needs: [native_addons, release_metadata]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      steps:
         - uses: actions/checkout@v4
         # Upstream 18.4.8 removed the shared setup-system-deps action (its test jobs run on the preloaded
         # omp-kata image). This job runs on a stock runner, so it keeps the same install inline.
         - name: Install system deps (skip when preloaded)
           run: |
              if command -v fd >/dev/null 2>&1 \
                 && command -v rg >/dev/null 2>&1 \
                 && command -v magick >/dev/null 2>&1 \
                 && pkg-config --exists cairo pango 2>/dev/null; then
                echo "System deps already present; skipping apt."
                exit 0
              fi
              sudo apt-get update
              sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep imagemagick
              sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
              sudo ln -sf /usr/bin/convert /usr/local/bin/magick
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - uses: astral-sh/setup-uv@v6
         - name: Expose PostgreSQL binaries
           run: |
              if ! command -v pg_config >/dev/null 2>&1 || [ "$(pg_config --version | grep -oE '[0-9]+' | head -n1)" != "18" ]; then
                sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
                curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/trusted.gpg.d/postgresql.gpg
                sudo apt-get update
                sudo apt-get install -y postgresql-18 postgresql-client-18
              fi
              echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
         - name: Run Work Ledger unit tests
           run: uv run --project python/omp-work --extra dev pytest python/omp-work/tests
         - name: Run PostgreSQL integration
           run: bun run test:py:work-ledger:integration
         - name: Run session candidate smoke
           run: bun run test:session:smoke
         - name: Run execution-cycle recovery smoke
           run: bun run test:session:execute
         - name: Stage isolated installed runtime
           run: |
              uv python install 3.13
              installed_python=$(uv python find 3.13)
              bun session-system/runtime/stage.ts \
                --source "$GITHUB_WORKSPACE" \
                --destination "$RUNNER_TEMP/omp-installed-runtime" \
                --bun "$(command -v bun)" --bun-version "$(bun --version)" \
                --uv "$(command -v uv)" --python "$installed_python" \
                --native "$GITHUB_WORKSPACE/packages/natives/native/pi_natives.linux-x64-baseline.node" \
                --native "$GITHUB_WORKSPACE/packages/natives/native/pi_natives.linux-x64-modern.node"
         - name: Resolve installed qualification mode
           id: qualification_mode
           shell: bash
           env:
              GH_TOKEN: ${{ github.token }}
              EVENT_NAME: ${{ github.event_name }}
              IS_RELEASE: ${{ needs.release_metadata.outputs.is-release }}
              PR_NUMBER: ${{ github.event.pull_request.number }}
              BEFORE: ${{ github.event.before }}
           run: |
              set -euo pipefail
              changed_files_file="$RUNNER_TEMP/omp-installed-changed-files.txt"
              : > "$changed_files_file"
              # Only a non-release PR or an incremental push needs a changed-file
              # list; schedule/dispatch/release and all-zero-BEFORE pushes select
              # full mode from the event alone (scripts/installed-qualification-mode.ts).
              diff_failed=""
              if [ "$IS_RELEASE" != "true" ] && [ "$EVENT_NAME" = "pull_request" ]; then
                if ! changed_files="$(gh pr diff "$PR_NUMBER" --name-only 2>&1)"; then
                  diff_failed="gh pr diff failed: $(printf '%s' "$changed_files" | tr '\n' ' ')"
                else
                  printf '%s\n' "$changed_files" > "$changed_files_file"
                fi
              elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && [[ ! "$BEFORE" =~ ^0+$ ]]; then
                if ! fetch_err="$(git fetch --no-tags --depth=1 origin "$BEFORE" 2>&1)"; then
                  diff_failed="git fetch origin $BEFORE failed: $(printf '%s' "$fetch_err" | tr '\n' ' ')"
                elif ! diff_out="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>&1)"; then
                  diff_failed="git diff $BEFORE $GITHUB_SHA failed: $(printf '%s' "$diff_out" | tr '\n' ' ')"
                else
                  printf '%s\n' "$diff_out" > "$changed_files_file"
                fi
              fi
              if [ -n "$diff_failed" ]; then
                targets="python/omp-work/tests/test_installed_runtime_isolation.py python/omp-work/tests/test_installed_execution_recovery.py"
                echo "installed qualification mode: full (changed files unavailable: $diff_failed)"
                echo "mode=full" >> "$GITHUB_OUTPUT"
                echo "targets=$targets" >> "$GITHUB_OUTPUT"
              else
                CHANGED_FILES_FILE="$changed_files_file" bun scripts/installed-qualification-mode.ts
              fi
         - name: Qualify installed isolation and controller recovery
           run: |
              ulimit -c 0
              command -v bwrap >/dev/null || sudo apt-get install -y bubblewrap
              manifest_sha=$(sha256sum "$RUNNER_TEMP/omp-installed-runtime/manifest.json")
              OMP_INSTALLED_RELEASE="$RUNNER_TEMP/omp-installed-runtime" \
              OMP_INSTALLED_MANIFEST_SHA256="${manifest_sha%% *}" \
              uv run --project python/omp-work --extra dev pytest -n 3 \
                ${{ steps.qualification_mode.outputs.targets }} \
                --basetemp="$RUNNER_TEMP/omp-installed-runtime-test-state" \
                --junitxml="$RUNNER_TEMP/omp-installed-runtime-tests.xml"
         - name: Preserve installed qualification evidence
           if: ${{ always() }}
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: installed-runtime-qualification-${{ github.run_id }}-${{ github.run_attempt }}
              path: |
                 ${{ runner.temp }}/omp-installed-runtime/manifest.json
                 ${{ runner.temp }}/omp-installed-runtime-tests.xml
              include-hidden-files: true
              if-no-files-found: warn
         # Controller fault/effect journals are large; keep them out of the
         # every-run manifest artifact and collect them only when they carry
         # signal: a failed run or a run that exercised full qualification mode.
         - name: Preserve installed controller evidence
           if: ${{ always() && (failure() || steps.qualification_mode.outputs.mode == 'full') }}
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: installed-runtime-evidence-${{ github.run_id }}-${{ github.run_attempt }}
              path: |
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/recovery-evidence.json
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/recovery-refusals.json
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/recovery-journey-*.json
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/before-execution.json
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/after-execution.json
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/before-workflow.json
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/before-session.jsonl
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/controller-*.rpc.jsonl
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/controller-*.stderr
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/task-recovery-evidence.json
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/task-*.jsonl
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/task-*.stderr
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/provider-*.json
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/authority-*.json
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/task-completed-output-*.md
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/child-output-final.md
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/session-ownership-*.json
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/session-ownership-*.jsonl
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/session-ownership-*.stderr
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/setup.json
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/first-run-*.json
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/first-run-*.jsonl
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/first-run-*.stderr
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/first-run-*.md
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/child-read-*.json
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/child-read-*.jsonl
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/child-read-*.stderr
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/read-resume-request-boundary.json
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/read-resume-request-*-child.jsonl
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/*.partial.bin
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/*.reader-error.json
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/*.read-error.bin
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/test_first_run_completed_child*/attempt-*/runtime/home/.omp/logs/omp.*.log
                 ${{ runner.temp }}/omp-installed-runtime-test-state/**/test_original_child_resumes_af*/runtime/home/.omp/logs/omp.*.log
              include-hidden-files: true
              if-no-files-found: warn
