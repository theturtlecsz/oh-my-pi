name: Upstream watch

# Standing upstream-compatibility guardrail, discovery leg (OMP-229).
# Weekly: find the newest stable upstream release above the accepted baseline,
# resolve it to one immutable commit, and record the finding in the job summary
# and a JSON artifact for that candidate. When a candidate exists, check fork
# patches against that commit and fail the run if any break (OMP-401).
# Incorporation itself rides the guarded update path (docs/upstream-guardrail.md).

on:
   schedule:
      - cron: "17 6 * * 1" # Mondays 06:17 UTC
   workflow_dispatch:

permissions:
   contents: read

jobs:
   discover:
      name: Discover newest stable upstream release
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.4"
         - name: Run discovery
           id: discovery
           env:
              GITHUB_TOKEN: ${{ github.token }}
           run: |
              set -euo pipefail
              bun scripts/upstream-discovery.ts --json | tee /tmp/discovery.json
              echo "newer=$(jq -r .newer /tmp/discovery.json)" >> "$GITHUB_OUTPUT"
              echo "version=$(jq -r '.candidate_version // empty' /tmp/discovery.json)" >> "$GITHUB_OUTPUT"
              echo "tag=$(jq -r '.candidate_tag // empty' /tmp/discovery.json)" >> "$GITHUB_OUTPUT"
              echo "commit=$(jq -r '.candidate_commit // empty' /tmp/discovery.json)" >> "$GITHUB_OUTPUT"
              echo "baseline=$(jq -r .baseline_version /tmp/discovery.json)" >> "$GITHUB_OUTPUT"
         - name: Record candidate finding in job summary
           if: steps.discovery.outputs.newer == 'true'
           env:
              VERSION: ${{ steps.discovery.outputs.version }}
              TAG: ${{ steps.discovery.outputs.tag }}
              COMMIT: ${{ steps.discovery.outputs.commit }}
              BASELINE: ${{ steps.discovery.outputs.baseline }}
           run: |
              set -euo pipefail
              cat <<EOF >> "$GITHUB_STEP_SUMMARY"
              ## Upstream Candidate Discovered: $TAG

              Weekly upstream discovery found stable release **$TAG** above the accepted baseline **$BASELINE**.

              - **Candidate Tag**: \`$TAG\`
              - **Immutable Commit**: \`$COMMIT\`
              - **Accepted Baseline**: \`$BASELINE\`

              Run the standing compatibility review per docs/upstream-guardrail.md. Incorporation is
              blocked until the review record passes the full guardrail (verify-upstream-handoff).
              EOF

              jq -n \
                --arg tag "$TAG" \
                --arg commit "$COMMIT" \
                --arg baseline "$BASELINE" \
                --arg version "$VERSION" \
                '{tag: $tag, commit: $commit, baseline: $baseline, version: $version, candidate_tag: $tag, candidate_commit: $commit, candidate_version: $version, baseline_version: $baseline}' \
                > upstream-candidate.json
         - name: Upload candidate artifact
           if: steps.discovery.outputs.newer == 'true'
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: upstream-candidate
              path: upstream-candidate.json
              if-no-files-found: error
              retention-days: 30
         - name: Fetch candidate and baseline commits
           if: steps.discovery.outputs.newer == 'true'
           env:
              COMMIT: ${{ steps.discovery.outputs.commit }}
           run: |
              set -euo pipefail
              repo="$(jq -r .upstream_repo docs/upstream-baseline.json)"
              target="$(jq -r .target docs/upstream-baseline.json)"
              git fetch --no-tags --depth=1 "$repo" "$target"
              git fetch --no-tags --depth=1 "$repo" "$COMMIT"
         - name: Check fork patches against candidate
           id: patch-check
           if: steps.discovery.outputs.newer == 'true'
           env:
              COMMIT: ${{ steps.discovery.outputs.commit }}
              TAG: ${{ steps.discovery.outputs.tag }}
           run: |
              set -euo pipefail
              status=0
              output="$(bun scripts/upstream-patch-check.ts --target "$COMMIT" 2>&1)" || status=$?
              {
                echo "## Fork patches vs $TAG"
                printf '%s\n' "$output"
              } >> "$GITHUB_STEP_SUMMARY"
              exit "$status"
         - name: Report up to date
           if: steps.discovery.outputs.newer != 'true'
           env:
              BASELINE: ${{ steps.discovery.outputs.baseline }}
           run: |
              set -euo pipefail
              echo "No stable upstream release above the accepted baseline ($BASELINE)."
              echo "No stable upstream release above the accepted baseline ($BASELINE)." >> "$GITHUB_STEP_SUMMARY"
